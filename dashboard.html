<section class="card" id="crypto-wallets">
    <h2 class="section-title">Make a Crypto Deposit</h2>
    <p style="margin-bottom: 18px; color: #66736b;">
        Send your deposit using the matching cryptocurrency network.
        Double-check the wallet address and network before sending.
    </p>
    <div style="margin-bottom: 22px;">
        <label for="usdt-wallet">USDT Wallet Address</label>
        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
            <input
                type="text"
                id="usdt-wallet"
                value="TFx5QpQQFJuEYJsGcC7v19W8Lafi64iqdf"
                readonly
                style="flex: 1; min-width: 220px;"
            >
            <button
                type="button"
                class="primary-button"
                onclick="copyWallet('usdt-wallet', this)"
            >
                Copy USDT Address
            </button>
        </div>
        <p style="font-size: 13px; color: #66736b; margin-top: 6px;">
            Confirm the supported USDT network with the recipient before sending.
        </p>
    </div>
    <div style="margin-bottom: 18px;">
        <label for="btc-wallet">Bitcoin (BTC) Wallet Address</label>
        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
            <input
                type="text"
                id="btc-wallet"
                value="bc1qu5vz52cyld9kma0f0y7jrhpcqv686httm822u6"
                readonly
                style="flex: 1; min-width: 220px;"
            >
            <button
                type="button"
                class="primary-button"
                onclick="copyWallet('btc-wallet', this)"
            >
                Copy BTC Address
            </button>
        </div>
        <p style="font-size: 13px; color: #66736b; margin-top: 6px;">
            Send Bitcoin only to the BTC address shown above.
        </p>
    </div>
    <div id="wallet-copy-message"
         role="status"
         style="margin-top: 12px; color: #176538;">
    </div>
</section>
<script>
async function copyWallet(inputId, button) {
    const walletInput = document.getElementById(inputId);
    const message = document.getElementById("wallet-copy-message");
    try {
        await navigator.clipboard.writeText(walletInput.value);
        message.textContent = "Wallet address copied successfully.";
    } catch (error) {
        walletInput.focus();
        walletInput.select();
        const copied = document.execCommand("copy");
        message.textContent = copied
            ? "Wallet address copied successfully."
            : "Please select and copy the wallet address manually.";
    }
}
</script>
