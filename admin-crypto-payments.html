<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Admin Crypto Payments | Nor Ellab Capital
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>


<header class="site-header">

    <div class="logo">
        Nor Ellab Capital
    </div>

    <nav>

        <a href="dashboard.html">
            Dashboard
        </a>

        <a href="admin-deposits.html">
            Deposits
        </a>

        <a href="admin-investments.html">
            Investments
        </a>

        <a href="admin-transactions.html">
            Transactions
        </a>

        <a href="admin-support.html">
            Support
        </a>

    </nav>

</header>



<section class="dashboard-hero">

    <h1>
        Crypto Payment Requests
    </h1>

    <p>
        Review cryptocurrency payment requests
        submitted by investors.
    </p>

</section>



<section class="dashboard-section">

    <div class="dashboard-container">

        <div
            class="dashboard-card"
            id="admin-content"
        >

            <p>
                Loading crypto payment requests...
            </p>

        </div>

    </div>

</section>



<footer>

    <p>
        © 2026 Nor Ellab Capital.
        All rights reserved.
    </p>

</footer>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


const supabaseUrl =
    "https://grgmsezyxxceheofmsoj.supabase.co";


const supabaseKey =
    "sb_publishable_wQ7jOyAqk1nAm_rQAapqog_Q5z_wTbc";


const supabaseClient =
    supabase.createClient(
        supabaseUrl,
        supabaseKey
    );


const adminContent =
    document.getElementById(
        "admin-content"
    );



/* CHECK ADMIN */

async function checkAdmin() {

    const {
        data: {
            user
        }
    } =
        await supabaseClient.auth.getUser();


    if (!user) {

        adminContent.innerHTML = `
            <h2>Access Denied</h2>

            <p>
                Please log in to access the
                administration area.
            </p>
        `;

        return false;
    }


    const {
        data: isAdmin,
        error
    } =
        await supabaseClient
            .rpc("is_admin");


    if (error || !isAdmin) {

        adminContent.innerHTML = `
            <h2>Access Denied</h2>

            <p>
                You do not have permission to
                access this page.
            </p>
        `;

        return false;
    }


    return true;
}



/* UPDATE STATUS */

async function saveStatus(
    paymentId
) {

    const select =
        document.getElementById(
            "status-" + paymentId
        );


    const button =
        document.getElementById(
            "button-" + paymentId
        );


    const newStatus =
        select.value;


    button.disabled =
        true;


    button.textContent =
        "Updating...";


    /*
        If the admin is completing the payment,
        use the secure database function.

        This creates the transaction and connects
        it to the crypto payment.
    */

    if (
        newStatus === "Completed"
    ) {

        const {
            data: transactionId,
            error: completionError
        } =
            await supabaseClient
                .rpc(
                    "complete_crypto_payment",
                    {
                        payment_id: paymentId
                    }
                );


        if (completionError) {

            alert(
                "Unable to complete crypto payment:\n\n" +
                completionError.message
            );

            button.disabled =
                false;

            button.textContent =
                "Update Status";

            return;
        }


        console.log(
            "Crypto payment completed.",
            "Transaction ID:",
            transactionId
        );


        button.textContent =
            "Completed";


        await loadPayments();

        return;
    }



    /*
        For all other statuses,
        update the payment normally.
    */

    const {
        error
    } =
        await supabaseClient
            .from("crypto_payment_requests")
            .update({
                status: newStatus
            })
            .eq(
                "id",
                paymentId
            );


    if (error) {

        alert(
            "Unable to update status:\n\n" +
            error.message
        );

        button.disabled =
            false;

        button.textContent =
            "Update Status";

        return;
    }


    button.textContent =
        "Updated";


    /*
        Reload the records from Supabase
        so the page displays the actual
        database value.
    */

    await loadPayments();

}



/* LOAD PAYMENTS */

async function loadPayments() {

    const {
        data,
        error
    } =
        await supabaseClient
            .from("crypto_payment_requests")
            .select("*")
            .order(
                "created_at",
                {
                    ascending: false
                }
            );


    if (error) {

        adminContent.innerHTML = `
            <h2>Error Loading Payments</h2>

            <p>
                ${error.message}
            </p>
        `;

        return;
    }


    if (
        !data ||
        data.length === 0
    ) {

        adminContent.innerHTML = `
            <h2>No Crypto Payments</h2>

            <p>
                No cryptocurrency payment requests
                have been submitted yet.
            </p>
        `;

        return;
    }



    let html = `

        <h2>
            Payment Requests
        </h2>

        <div
            style="
                overflow-x:auto;
                margin-top:20px;
            "
        >

            <table
                style="
                    width:100%;
                    border-collapse:collapse;
                    min-width:1100px;
                "
            >

                <thead>

                    <tr>

                        <th style="padding:12px; text-align:left;">
                            Asset
                        </th>

                        <th style="padding:12px; text-align:left;">
                            Amount
                        </th>

                        <th style="padding:12px; text-align:left;">
                            Total
                        </th>

                        <th style="padding:12px; text-align:left;">
                            Payment Method
                        </th>

                        <th style="padding:12px; text-align:left;">
                            TXID
                        </th>

                        <th style="padding:12px; text-align:left;">
                            Status
                        </th>

                        <th style="padding:12px; text-align:left;">
                            Date
                        </th>

                    </tr>

                </thead>

                <tbody>
    `;



    data.forEach(
        function(payment) {

            const date =
                new Date(
                    payment.created_at
                ).toLocaleString();


            const currentStatus =
                payment.status ||
                "Pending";


            html += `

                <tr>

                    <td style="padding:12px; border-bottom:1px solid #eee;">
                        ${payment.asset || "—"}
                    </td>


                    <td style="padding:12px; border-bottom:1px solid #eee;">
                        ${payment.amount || "—"}
                    </td>


                    <td style="padding:12px; border-bottom:1px solid #eee;">

                        $${Number(
                            payment.total || 0
                        ).toLocaleString(
                            undefined,
                            {
                                minimumFractionDigits:2,
                                maximumFractionDigits:2
                            }
                        )}

                    </td>


                    <td style="padding:12px; border-bottom:1px solid #eee;">

                        ${payment.payment_method || "—"}

                    </td>


                    <td
                        style="
                            padding:12px;
                            border-bottom:1px solid #eee;
                            word-break:break-all;
                        "
                    >

                        ${payment.payment_reference || "—"}

                    </td>


                    <td
                        style="
                            padding:12px;
                            border-bottom:1px solid #eee;
                        "
                    >

                        <select
                            id="status-${payment.id}"
                            style="
                                padding:8px;
                                border:1px solid #d1d5db;
                                border-radius:6px;
                            "
                        >

                            <option
                                value="Pending"
                                ${currentStatus === "Pending" ? "selected" : ""}
                            >
                                Pending
                            </option>


                            <option
                                value="Processing"
                                ${currentStatus === "Processing" ? "selected" : ""}
                            >
                                Processing
                            </option>


                            <option
                                value="Completed"
                                ${currentStatus === "Completed" ? "selected" : ""}
                            >
                                Completed
                            </option>


                            <option
                                value="Failed"
                                ${currentStatus === "Failed" ? "selected" : ""}
                            >
                                Failed
                            </option>


                            <option
                                value="Cancelled"
                                ${currentStatus === "Cancelled" ? "selected" : ""}
                            >
                                Cancelled
                            </option>

                        </select>


                        <button
                            type="button"
                            class="dashboard-button"
                            id="button-${payment.id}"
                            style="margin-top:8px;"
                            onclick="saveStatus(${payment.id})"
                        >
                            Update Status
                        </button>

                    </td>


                    <td style="padding:12px; border-bottom:1px solid #eee;">

                        ${date}

                    </td>

                </tr>

            `;

        }
    );


    html += `

                </tbody>

            </table>

        </div>

    `;


    adminContent.innerHTML =
        html;
}



/* START */

async function startPage() {

    const isAdmin =
        await checkAdmin();


    if (!isAdmin) {
        return;
    }


    await loadPayments();

}


startPage();


</script>


</body>

</html>
