<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Update Password | Nor Ellab Capital</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- Header -->

    <header class="site-header">

        <div class="logo">
            Nor Ellab Capital
        </div>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="investments.html">
                Investments
            </a>

            <a href="login.html">
                Login
            </a>

            <a href="create-account.html">
                Create Account
            </a>

        </nav>

    </header>



    <!-- Hero -->

    <section class="update-password-hero">

        <h1>
            Create a New Password
        </h1>

        <p>
            Choose a new secure password for your
            Nor Ellab Capital investor account.
        </p>

    </section>



    <!-- Password Form -->

    <section class="update-password-section">

        <div class="update-password-card">

            <h2>
                Update Password
            </h2>

            <p class="update-password-intro">
                Enter your new password below.
            </p>


            <form id="update-password-form">


                <div class="form-group">

                    <label for="new-password">
                        New Password
                    </label>

                    <input
                        type="password"
                        id="new-password"
                        placeholder="Enter new password"
                        minlength="6"
                        required
                    >

                </div>



                <div class="form-group">

                    <label for="confirm-new-password">
                        Confirm New Password
                    </label>

                    <input
                        type="password"
                        id="confirm-new-password"
                        placeholder="Confirm new password"
                        minlength="6"
                        required
                    >

                </div>



                <button
                    type="submit"
                    class="update-password-button"
                >
                    Update Password
                </button>


            </form>


            <p id="update-password-message"></p>


        </div>

    </section>



    <!-- Footer -->

    <footer>

        <p>
            © 2026 Nor Ellab Capital.
            All rights reserved.
        </p>

    </footer>



    <!-- Supabase -->

 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

    const supabaseUrl =
        "https://grgmsezyxxceheofmsoj.supabase.co";

    const supabaseKey =
        "sb_publishable_wQ7jOyAqk1nAm_rQAapqog_Q5z_wTbc";

    const supabaseClient =
        supabase.createClient(
            supabaseUrl,
            supabaseKey
        );


    const updateForm =
        document.getElementById(
            "update-password-form"
        );

    const updateMessage =
        document.getElementById(
            "update-password-message"
        );


    supabaseClient.auth.onAuthStateChange(
        function(event, session) {

            console.log(
                "Auth event:",
                event
            );

            if (
                event === "PASSWORD_RECOVERY"
                && session
            ) {

                updateMessage.textContent =
                    "You can now create your new password.";

            }

        }
    );


    updateForm.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const newPassword =
                document.getElementById(
                    "new-password"
                ).value;


            const confirmPassword =
                document.getElementById(
                    "confirm-new-password"
                ).value;


            if (
                newPassword !==
                confirmPassword
            ) {

                updateMessage.textContent =
                    "Passwords do not match.";

                return;

            }


            updateMessage.textContent =
                "Updating your password...";


            const {
                data,
                error
            } =
                await supabaseClient.auth
                .updateUser({

                    password:
                        newPassword

                });


            if (error) {

                updateMessage.textContent =
                    error.message;

                console.log(error);

                return;

            }


            updateMessage.textContent =
                "Password updated successfully. You can now log in.";

            updateForm.reset();

        }
    );

</script>


</body>

</html>
