<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Support Chat | Nor Ellab Capital</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            color: #111827;
        }

        header {
            background-color: #111827;
            color: white;
            padding: 20px;
        }

        header h1 {
            margin: 0;
            font-size: 22px;
        }

        header p {
            margin: 6px 0 0;
            color: #d1d5db;
        }

        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
        }

        .chat-card {
            background-color: white;
            border-radius: 10px;
            border: 1px solid #e5e7eb;
            overflow: hidden;
        }

        .chat-header {
            padding: 18px;
            border-bottom: 1px solid #e5e7eb;
        }

        .chat-header h2 {
            margin: 0 0 5px;
        }

        .chat-header p {
            margin: 0;
            color: #6b7280;
        }

        .messages {
            height: 420px;
            overflow-y: auto;
            padding: 20px;
            background-color: #f9fafb;
        }

        .message {
            margin-bottom: 15px;
            max-width: 80%;
            padding: 12px 15px;
            border-radius: 10px;
        }

        .message.investor {
            margin-left: auto;
            background-color: #111827;
            color: white;
        }

        .message.support {
            margin-right: auto;
            background-color: white;
            border: 1px solid #e5e7eb;
        }

        .message small {
            display: block;
            margin-top: 6px;
            font-size: 11px;
            opacity: 0.7;
        }

        .empty {
            text-align: center;
            color: #6b7280;
            padding: 50px 20px;
        }

        .message-form {
            display: flex;
            gap: 10px;
            padding: 15px;
            border-top: 1px solid #e5e7eb;
        }

        .message-form textarea {
            flex: 1;
            min-height: 50px;
            max-height: 120px;
            resize: vertical;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-family: Arial, sans-serif;
        }

        .message-form button {
            align-self: flex-end;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            background-color: #111827;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        .message-form button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .status-message {
            padding: 12px 20px;
            color: #6b7280;
            font-size: 14px;
        }

        @media (max-width: 600px) {

            .container {
                margin: 15px auto;
                padding: 10px;
            }

            .message-form {
                flex-direction: column;
            }

            .message-form button {
                width: 100%;
            }

        }

    </style>

</head>

<body>

    <header>

        <h1>
            Nor Ellab Capital
        </h1>

        <p>
            Investor Support
        </p>

    </header>


    <main class="container">

        <div class="chat-card">

            <div class="chat-header">

                <h2>
                    Support Chat
                </h2>

                <p>
                    Contact Nor Ellab Capital support.
                </p>

            </div>


            <div
                id="status-message"
                class="status-message"
            >
                Connecting to support...
            </div>


            <div
                id="messages"
                class="messages"
            >

                <div class="empty">
                    Loading conversation...
                </div>

            </div>


            <form
                id="message-form"
                class="message-form"
            >

                <textarea
                    id="message-input"
                    placeholder="Type your message..."
                    required
                ></textarea>

                <button
                    type="submit"
                    id="send-button"
                >
                    Send
                </button>

            </form>

        </div>

    </main>


    <!-- SUPABASE -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- FIREBASE -->

    <script type="module">

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


        import {
            getMessaging,
            getToken,
            onMessage
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-messaging.js";


        const firebaseConfig = {

            apiKey:
                "AIzaSyDEfVh4NTouxaLH2Lgi-eT1wwky3fA0ATY",

            authDomain:
                "nor-ellab-capital-72e92.firebaseapp.com",

            projectId:
                "nor-ellab-capital-72e92",

            storageBucket:
                "nor-ellab-capital-72e92.firebasestorage.app",

            messagingSenderId:
                "901471621790",

            appId:
                "1:901471621790:web:e83ac520ae5c07cc00218f"

        };


        const vapidKey =
            "BPqTS1zE4kpp5bAs7br0lpyUCIiVqldI6wEy_wCgZiieQ-IaE1CXN_JUe1YJQNFVJqUqWx2T6vNkl098hZjLTsc";


        let firebaseMessaging = null;


        try {

            const firebaseApp =
                initializeApp(
                    firebaseConfig
                );


            firebaseMessaging =
                getMessaging(
                    firebaseApp
                );


            onMessage(
                firebaseMessaging,
                function(payload) {

                    console.log(
                        "Foreground notification received:",
                        payload
                    );

                    if (
                        payload &&
                        payload.notification &&
                        Notification.permission ===
                        "granted"
                    ) {

                        new Notification(
                            payload.notification.title ||
                            "Nor Ellab Capital",
                            {
                                body:
                                    payload.notification.body ||
                                    "You have a new notification."
                            }
                        );

                    }

                }
            );


        } catch (error) {

            console.log(
                "Firebase initialization skipped:",
                error
            );

        }


        /* =========================
           SUPABASE
        ========================= */

        const supabaseUrl =
            "https://grgmsezyxxceheofmsoj.supabase.co";


        const supabaseKey =
            "sb_publishable_wQ7jOyAqk1nAm_rQAapqog_Q5z_wTbc";


        const supabaseClient =
            supabase.createClient(
                supabaseUrl,
                supabaseKey
            );


        /* =========================
           PAGE ELEMENTS
        ========================= */

        const statusMessage =
            document.getElementById(
                "status-message"
            );


        const messagesContainer =
            document.getElementById(
                "messages"
            );


        const messageForm =
            document.getElementById(
                "message-form"
            );


        const messageInput =
            document.getElementById(
                "message-input"
            );


        const sendButton =
            document.getElementById(
                "send-button"
            );


        let currentUser = null;


        let conversationId = null;


        /* =========================
           START SUPPORT CHAT
        ========================= */

        async function startSupportChat() {

            try {

                const {
                    data: {
                        user
                    },
                    error: userError
                } =
                    await supabaseClient.auth.getUser();


                if (userError) {

                    console.log(
                        "User check error:",
                        userError
                    );

                }


                if (!user) {

                    statusMessage.textContent =
                        "Please log in to use support chat.";


                    messageForm.style.display =
                        "none";


                    messagesContainer.innerHTML =
                        `
                        <div class="empty">
                            Please log in to access support.
                        </div>
                        `;


                    return;

                }


                currentUser =
                    user;


                /* =========================
                   LOAD CONVERSATION
                ========================= */

                const {
                    data: conversations,
                    error: conversationError
                } =
                    await supabaseClient
                        .from("support_conversations")
                        .select("*")
                        .eq(
                            "user_id",
                            user.id
                        )
                        .order(
                            "created_at",
                            {
                                ascending: false
                            }
                        )
                        .limit(1);


                if (conversationError) {

                    console.log(
                        "Conversation error:",
                        conversationError
                    );


                    statusMessage.textContent =
                        "Unable to load your support conversation.";


                    return;

                }


                if (
                    conversations &&
                    conversations.length > 0
                ) {

                    conversationId =
                        conversations[0].id;

                } else {

                    const {
                        data: newConversation,
                        error: createError
                    } =
                        await supabaseClient
                            .from("support_conversations")
                            .insert({

                                user_id:
                                    user.id,

                                subject:
                                    "General Support",

                                status:
                                    "Open"

                            })
                            .select()
                            .single();


                    if (createError) {

                        console.log(
                            "Conversation creation error:",
                            createError
                        );


                        statusMessage.textContent =
                            "Unable to create support conversation.";


                        return;

                    }


                    conversationId =
                        newConversation.id;

                }


                statusMessage.textContent =
                    "Connected to support.";


                await loadMessages();


                /*
                    IMPORTANT:

                    Firebase setup happens AFTER
                    the support chat has loaded.

                    Therefore Firebase cannot block
                    the support chat.
                */

                setupPushNotifications();


            } catch (error) {

                console.log(
                    "Support chat error:",
                    error
                );


                statusMessage.textContent =
                    "Unable to connect to support.";

            }

        }


        /* =========================
           LOAD MESSAGES
        ========================= */

        async function loadMessages() {

            const {
                data: messages,
                error
            } =
                await supabaseClient
                    .from("support_messages")
                    .select("*")
                    .eq(
                        "conversation_id",
                        conversationId
                    )
                    .order(
                        "created_at",
                        {
                            ascending: true
                        }
                    );


            if (error) {

                console.log(
                    "Message loading error:",
                    error
                );


                messagesContainer.innerHTML =
                    `
                    <div class="empty">
                        Unable to load messages.
                    </div>
                    `;


                return;

            }


            if (
                !messages ||
                messages.length === 0
            ) {

                messagesContainer.innerHTML =
                    `
                    <div class="empty">
                        No messages yet.<br>
                        Send a message to contact support.
                    </div>
                    `;


                return;

            }


            messagesContainer.innerHTML =
                "";


            messages.forEach(
                function(message) {

                    const messageElement =
                        document.createElement(
                            "div"
                        );


                    const isInvestor =
                        message.sender_id ===
                        currentUser.id;


                    messageElement.className =
                        "message " +
                        (
                            isInvestor
                                ? "investor"
                                : "support"
                        );


                    messageElement.innerHTML =
                        `

                        ${escapeHtml(
                            message.message
                        )}

                        <small>
                            ${
                                new Date(
                                    message.created_at
                                ).toLocaleString()
                            }
                        </small>

                    `;


                    messagesContainer.appendChild(
                        messageElement
                    );

                }
            );


            messagesContainer.scrollTop =
                messagesContainer.scrollHeight;

        }


        /* =========================
           PUSH NOTIFICATIONS
        ========================= */

        async function setupPushNotifications() {

            try {

                if (!firebaseMessaging) {

                    console.log(
                        "Firebase Messaging is unavailable."
                    );

                    return;

                }


                if (
                    !("Notification" in window)
                ) {

                    console.log(
                        "Browser notifications are not supported."
                    );

                    return;

                }


                if (
                    !("serviceWorker" in navigator)
                ) {

                    console.log(
                        "Service workers are not supported."
                    );

                    return;

                }


                /*
                    We deliberately do not let
                    notification setup interfere
                    with the chat.
                */


                const permission =
                    await Notification.requestPermission();


                if (
                    permission !== "granted"
                ) {

                    console.log(
                        "Notification permission was not granted."
                    );

                    return;

                }


                const registration =
                    await navigator.serviceWorker.register(
                        "/firebase-messaging-sw.js"
                    );


                console.log(
                    "Firebase service worker registered."
                );


                const token =
                    await getToken(
                        firebaseMessaging,
                        {
                            vapidKey:
                                vapidKey,

                            serviceWorkerRegistration:
                                registration
                        }
                    );


                if (!token) {

                    console.log(
                        "No FCM token was received."
                    );

                    return;

                }


                console.log(
                    "FCM token received."
                );


                const {
                    error: tokenError
                } =
                    await supabaseClient
                        .from("push_tokens")
                        .upsert(
                            {

                                user_id:
                                    currentUser.id,

                                token:
                                    token,

                                platform:
                                    "web",

                                updated_at:
                                    new Date().toISOString()

                            },
                            {

                                onConflict:
                                    "user_id,token"

                            }
                        );


                if (tokenError) {

                    console.log(
                        "Unable to save FCM token:",
                        tokenError
                    );


                    return;

                }


                console.log(
                    "FCM token saved successfully."
                );


            } catch (error) {

                /*
                    IMPORTANT:

                    Firebase errors are only logged.
                    They do NOT break the support chat.
                */

                console.log(
                    "Push notification setup failed:",
                    error
                );

            }

        }


        /* =========================
           SEND MESSAGE
        ========================= */

        messageForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const message =
                    messageInput.value.trim();


                if (!message) {

                    return;

                }


                if (!conversationId) {

                    statusMessage.textContent =
                        "Support chat is not ready.";


                    return;

                }


                sendButton.disabled =
                    true;


                sendButton.textContent =
                    "Sending...";


                const {
                    error
                } =
                    await supabaseClient
                        .from("support_messages")
                        .insert({

                            conversation_id:
                                conversationId,

                            sender_id:
                                currentUser.id,

                            message:
                                message

                        });


                if (error) {

                    console.log(
                        "Send message error:",
                        error
                    );


                    statusMessage.textContent =
                        "Unable to send message.";


                    sendButton.disabled =
                        false;


                    sendButton.textContent =
                        "Send";


                    return;

                }


                messageInput.value =
                    "";


                sendButton.disabled =
                    false;


                sendButton.textContent =
                    "Send";


                await loadMessages();

            }
        );


        /* =========================
           ESCAPE HTML
        ========================= */

        function escapeHtml(text) {

            const div =
                document.createElement(
                    "div"
                );


            div.textContent =
                text;


            return div.innerHTML;

        }


        /* =========================
           START CHAT
        ========================= */

        startSupportChat();

    </script>

</body>

</html>
