
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Deposit Review | Nor Ellab Capital</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            color: #111827;
        }

        header {
            background-color: #111827;
            color: white;
            padding: 20px;
        }

        header h1 {
            margin: 0;
            font-size: 22px;
        }

        header p {
            margin: 6px 0 0;
            color: #d1d5db;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }

        .page-title {
            margin-bottom: 25px;
        }

        .page-title h2 {
            margin-bottom: 8px;
        }

        .page-title p {
            color: #6b7280;
        }

        .admin-message {
            padding: 15px;
            background-color: white;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #e5e7eb;
            line-height: 1.6;
        }

        .deposit-card {
            background-color: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #e5e7eb;
        }

        .deposit-card h3 {
            margin-top: 0;
        }

        .deposit-row {
            margin: 10px 0;
            overflow-wrap: anywhere;
        }

        .deposit-row strong {
            display: inline-block;
            min-width: 170px;
        }

        .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        .pending {
            background-color: #fef3c7;
            color: #92400e;
        }

        .verified {
            background-color: #dbeafe;
            color: #1e40af;
        }

        .completed {
            background-color: #dcfce7;
            color: #166534;
        }

        .txid {
            word-break: break-all;
            font-family: monospace;
            font-size: 14px;
        }

        .verification-box {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e5e7eb;
        }

        .verification-box label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .verification-box textarea {
            width: 100%;
            min-height: 90px;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            resize: vertical;
            font-family: Arial, sans-serif;
        }

        .action-button,
        .refresh-button {
            margin-top: 12px;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            background-color: #111827;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        .action-button:hover,
        .refresh-button:hover {
            background-color: #1f2937;
        }

        .action-button:disabled,
        .refresh-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .empty {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            color: #6b7280;
        }

        .success-message {
            margin-top: 10px;
            color: #166534;
            font-weight: 600;
        }

        .error-message {
            margin-top: 10px;
            color: #b91c1c;
            font-weight: 600;
        }

        @media (max-width: 600px) {
            .container {
                margin: 20px auto;
                padding: 15px;
            }

            .deposit-row strong {
                display: block;
                margin-bottom: 4px;
            }
        }
    </style>

</head>

<body>

    <header>
        <h1>Nor Ellab Capital</h1>
        <p>Admin Deposit Review</p>
    </header>

    <main class="container">

        <div class="page-title">
            <h2>Deposit Requests</h2>
            <p>
                Review investor deposit requests and their verification status.
            </p>
        </div>

        <div
            id="admin-message"
            class="admin-message"
            aria-live="polite"
        >
            Checking administrator access...
        </div>

        <button
            id="refresh-button"
            class="refresh-button"
            type="button"
        >
            Refresh Deposits
        </button>

        <div id="deposit-list"></div>

    </main>

    <script>

        const supabaseUrl =
            "https://grgmsezyxxceheofmsoj.supabase.co";

        const supabaseKey =
            "sb_publishable_wQ7jOyAqk1nAm_rQAapqog_Q5z_wTbc";

        const supabaseClient =
            supabase.createClient(
                supabaseUrl,
                supabaseKey
            );

        const adminMessage =
            document.getElementById("admin-message");

        const depositList =
            document.getElementById("deposit-list");

        const refreshButton =
            document.getElementById("refresh-button");


        function showMessage(message, isError = false) {
            adminMessage.textContent = message;
            adminMessage.style.color =
                isError ? "#b91c1c" : "#166534";
        }


        async function loadAdminDeposits() {

            refreshButton.disabled = true;
            depositList.replaceChildren();

            showMessage("Checking administrator access...");

            try {

                // STEP 1: Check logged-in user

                const {
                    data: { user },
                    error: userError
                } = await supabaseClient.auth.getUser();

                if (userError) {
                    throw new Error(
                        "Login verification failed: " +
                        userError.message
                    );
                }

                if (!user) {
                    showMessage(
                        "You must be logged in to access this page.",
                        true
                    );

                    return;
                }


                // STEP 2: Verify administrator access
                // Uses the same function as admin-dashboard.html

                const {
                    data: adminResult,
                    error: adminError
                } = await supabaseClient.rpc("is_admin");

                if (adminError) {
                    throw new Error(
                        "Unable to verify administrator access: " +
                        adminError.message
                    );
                }

                const allowed =
                    adminResult === true ||
                    adminResult === "true";

                if (!allowed) {
                    showMessage(
                        "Administrator access required. Your account is not authorized.",
                        true
                    );

                    return;
                }

                showMessage(
                    "Administrator access confirmed for " +
                    user.email
                );


                // STEP 3: Load deposit requests

                const {
                    data: deposits,
                    error
                } = await supabaseClient
                    .from("deposits")
                    .select("*")
                    .order("created_at", {
                        ascending: false
                    });

                if (error) {
                    throw new Error(
                        "Unable to load deposit requests: " +
                        error.message
                    );
                }


                // STEP 4: Check if deposits exist

                if (!deposits || deposits.length === 0) {

                    depositList.innerHTML = `
                        <div class="empty">
                            No deposit requests found.
                        </div>
                    `;

                    return;
                }


                // STEP 5: Display deposits

                deposits.forEach(function(deposit) {

                    const card =
                        document.createElement("div");

                    card.className = "deposit-card";

                    const status =
                        String(deposit.status || "Pending");

                    let statusClass = "pending";

                    if (status.toLowerCase() === "verified") {
                        statusClass = "verified";
                    }

                    if (status.toLowerCase() === "completed") {
                        statusClass = "completed";
                    }


                    const formattedAmount =
                        Number(deposit.amount || 0).toLocaleString(
                            "en-US",
                            {
                                minimumFractionDigits: 2,
                                maximumFractionDigits: 2
                            }
                        );

                    const createdAt = deposit.created_at
                        ? new Date(deposit.created_at).toLocaleString()
                        : "Unknown";

                    const verifiedAt = deposit.verified_at
                        ? new Date(deposit.verified_at).toLocaleString()
                        : "Not verified";


                    const fields = [
                        ["Asset", deposit.asset || "Not provided"],
                        ["Network", deposit.network || "Not provided"],
                        ["Amount", "$" + formattedAmount],
                        ["Status", status],
                        ["TXID", deposit.transaction_hash || "Not provided"],
                        ["Verification Note", deposit.verification_note || "None"],
                        ["Verified At", verifiedAt],
                        ["Submitted", createdAt]
                    ];


                    const heading =
                        document.createElement("h3");

                    heading.textContent =
                        "Deposit #" + deposit.id;

                    card.appendChild(heading);


                    fields.forEach(function(field) {

                        const row =
                            document.createElement("div");

                        row.className = "deposit-row";

                        const label =
                            document.createElement("strong");

                        label.textContent = field[0] + ":";

                        const value =
                            document.createElement("span");

                        value.textContent = field[1];

                        if (field[0] === "Status") {
                            value.className =
                                "status " + statusClass;
                        }

                        if (field[0] === "TXID") {
                            value.className = "txid";
                        }

                        row.append(label, value);

                        card.appendChild(row);

                    });


                    // STEP 6: Pending deposit verification

                    if (status.toLowerCase() === "pending") {

                        const verificationBox =
                            document.createElement("div");

                        verificationBox.className =
                            "verification-box";

                        const label =
                            document.createElement("label");

                        label.textContent =
                            "Verification Note";

                        const textarea =
                            document.createElement("textarea");

                        textarea.placeholder =
                            "Enter the reason or evidence for approving this deposit.";

                        const button =
                            document.createElement("button");

                        button.className = "action-button";

                        button.textContent = "Verify Deposit";

                        const message =
                            document.createElement("div");


                        button.addEventListener("click", async function() {

                            const note = textarea.value.trim();

                            if (!deposit.transaction_hash) {
                                message.className = "error-message";
                                message.textContent =
                                    "A TXID is required before verification.";
                                return;
                            }

                            if (!note) {
                                message.className = "error-message";
                                message.textContent =
                                    "Please enter a verification note.";
                                return;
                            }

                            const confirmed = confirm(
                                "Have you independently verified that this payment was genuinely received?"
                            );

                            if (!confirmed) return;

                            button.disabled = true;
                            button.textContent = "Updating...";

                            try {

                                const { error } =
                                    await supabaseClient
                                        .from("deposits")
                                        .update({
                                            status: "Verified",
                                            verification_note: note,
                                            verified_at: new Date().toISOString()
                                        })
                                        .eq("id", deposit.id);

                                if (error) throw error;

                                message.className = "success-message";

                                message.textContent =
                                    "Deposit marked as Verified.";

                                setTimeout(loadAdminDeposits, 800);

                            } catch (error) {

                                console.error(error);

                                message.className = "error-message";

                                message.textContent =
                                    "Unable to update deposit: " +
                                    error.message;

                                button.disabled = false;
                                button.textContent = "Verify Deposit";

                            }

                        });


                        verificationBox.append(
                            label,
                            textarea,
                            button,
                            message
                        );

                        card.appendChild(verificationBox);

                    }


                    // STEP 7: Complete verified deposits

                    if (status.toLowerCase() === "verified") {

                        const completionBox =
                            document.createElement("div");

                        completionBox.className =
                            "verification-box";

                        const button =
                            document.createElement("button");

                        button.className = "action-button";

                        button.textContent = "Complete Deposit";

                        const message =
                            document.createElement("div");


                        button.addEventListener("click", async function() {

                            const confirmed = confirm(
                                "Only continue if this payment has genuinely been received and verified. Completing this record does not itself credit an investor balance."
                            );

                            if (!confirmed) return;

                            button.disabled = true;
                            button.textContent = "Completing...";

                            try {

                                const { error } =
                                    await supabaseClient
                                        .from("deposits")
                                        .update({
                                            status: "Completed"
                                        })
                                        .eq("id", deposit.id);

                                if (error) throw error;

                                message.className = "success-message";

                                message.textContent =
                                    "Deposit marked as Completed.";

                                setTimeout(loadAdminDeposits, 800);

                            } catch (error) {

                                console.error(error);

                                message.className = "error-message";

                                message.textContent =
                                    "Unable to complete deposit: " +
                                    error.message;

                                button.disabled = false;
                                button.textContent = "Complete Deposit";

                            }

                        });


                        completionBox.append(
                            button,
                            message
                        );

                        card.appendChild(completionBox);

                    }


                    depositList.appendChild(card);

                });


                showMessage(
                    "Administrator access confirmed. " +
                    deposits.length +
                    " deposit request(s) loaded."
                );

            } catch (error) {

                console.error("Admin deposit error:", error);

                showMessage(error.message, true);

                depositList.innerHTML = `
                    <div class="empty">
                        Unable to load deposit requests.
                        Check the administrator permissions and database access.
                    </div>
                `;

            } finally {

                refreshButton.disabled = false;

            }

        }


        refreshButton.addEventListener(
            "click",
            loadAdminDeposits
        );

        loadAdminDeposits();

    </script>

</body>
</html>
