<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Notifications | Nor Ellab Capital</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
        }

        header {
            background: #0b1f3a;
            color: white;
            padding: 18px 20px;
        }

        header h1 {
            margin: 0 0 6px;
            font-size: 22px;
        }

        header p {
            margin: 0;
            color: #cbd5e1;
            font-size: 14px;
        }

        nav {
            background: white;
            padding: 12px 20px;
            border-bottom: 1px solid #ddd;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        nav a {
            text-decoration: none;
            color: #0b1f3a;
            font-weight: bold;
            font-size: 14px;
        }

        .container {
            max-width: 1100px;
            margin: 25px auto;
            padding: 0 18px;
        }

        .top-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .top-section h2 {
            margin: 0;
            color: #0b1f3a;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
        }

        .card h3 {
            margin-top: 0;
            color: #0b1f3a;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            font-size: 14px;
        }

        select,
        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            margin-bottom: 15px;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 12px 18px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        .send-btn {
            background: #0b1f3a;
            color: white;
        }

        .send-btn:hover {
            background: #163b68;
        }

        .delete-btn {
            background: #dc2626;
            color: white;
            padding: 8px 12px;
        }

        .read-btn {
            background: #e5e7eb;
            color: #111827;
            padding: 8px 12px;
            margin-right: 6px;
        }

        .notification {
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .notification.unread {
            border-left: 5px solid #0b1f3a;
            background: #f8fafc;
        }

        .notification-header {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
        }

        .notification-title {
            font-weight: bold;
            color: #0b1f3a;
            font-size: 16px;
        }

        .status {
            font-size: 12px;
            font-weight: bold;
            padding: 5px 8px;
            border-radius: 20px;
        }

        .status.unread {
            background: #fee2e2;
            color: #991b1b;
        }

        .status.read {
            background: #dcfce7;
            color: #166534;
        }

        .message {
            margin: 10px 0;
            color: #4b5563;
        }

        .meta {
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 12px;
            word-break: break-word;
        }

        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #6b7280;
        }

        .message-box {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .loading {
            color: #6b7280;
            text-align: center;
            padding: 20px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 0 12px;
            }

            header {
                padding: 16px;
            }

            nav {
                padding: 12px;
            }

            .card {
                padding: 16px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Nor Ellab Capital</h1>
    <p>Admin Notifications</p>
</header>

<nav>
    <a href="admin-dashboard.html">Admin Dashboard</a>
    <a href="admin-deposits.html">Deposits</a>
    <a href="admin-investments.html">Investments</a>
    <a href="admin-transactions.html">Transactions</a>
    <a href="admin-crypto-payments.html">Crypto Payments</a>
    <a href="admin-support.html">Support</a>
    <a href="dashboard.html">Investor Dashboard</a>
</nav>

<div class="container">

    <div class="top-section">
        <h2>Notifications</h2>
    </div>

    <div id="messageBox" class="message-box"></div>

    <div class="card">
        <h3>Send Notification</h3>

        <label for="userSelect">Investor</label>
        <select id="userSelect">
            <option value="">Loading investors...</option>
        </select>

        <label for="title">Title</label>
        <input
            type="text"
            id="title"
            placeholder="Notification title"
        >

        <label for="type">Type</label>
        <select id="type">
            <option value="general">General</option>
            <option value="support">Support</option>
            <option value="deposit">Deposit</option>
            <option value="investment">Investment</option>
            <option value="transaction">Transaction</option>
            <option value="security">Security</option>
        </select>

        <label for="message">Message</label>
        <textarea
            id="message"
            placeholder="Write your notification..."
        ></textarea>

        <button class="send-btn" onclick="sendNotification()">
            Send Notification
        </button>
    </div>

    <div class="card">
        <h3>All Notifications</h3>

        <div id="notificationsList">
            <div class="loading">Loading notifications...</div>
        </div>
    </div>

</div>

<script>
    const SUPABASE_URL =
        "https://grgmsezyxxceheofmsoj.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_wQ7jOyAqk1nAm_rQAapqog_Q5z_wTbc";

    const supabaseClient =
        supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    function showMessage(message, type) {
        const box = document.getElementById("messageBox");

        box.textContent = message;
        box.className = "message-box " + type;
        box.style.display = "block";

        setTimeout(() => {
            box.style.display = "none";
        }, 4000);
    }


    async function checkAdmin() {

        const {
            data: { user },
            error
        } = await supabaseClient.auth.getUser();

        if (error || !user) {
            window.location.href = "admin-login.html";
            return false;
        }

        const {
            data: isAdmin,
            error: adminError
        } = await supabaseClient.rpc("is_admin");

        if (adminError || isAdmin !== true) {
            await supabaseClient.auth.signOut();

            alert("Access Denied");

            window.location.href = "admin-login.html";

            return false;
        }

        return true;
    }


    async function loadInvestors() {

        const select =
            document.getElementById("userSelect");

        const {
            data,
            error
        } = await supabaseClient
            .from("profiles")
            .select("*")
            .order("created_at", {
                ascending: false
            });

        if (error) {
            console.error(error);

            select.innerHTML =
                '<option value="">Unable to load investors</option>';

            return;
        }

        if (!data || data.length === 0) {

            select.innerHTML =
                '<option value="">No investors found</option>';

            return;
        }

        select.innerHTML =
            '<option value="">Select an investor</option>';

        data.forEach(profile => {

            const option =
                document.createElement("option");

            option.value = profile.id;

            option.textContent =
                profile.full_name ||
                profile.email ||
                profile.id;

            select.appendChild(option);
        });
    }


    async function loadNotifications() {

        const container =
            document.getElementById("notificationsList");

        const {
            data,
            error
        } = await supabaseClient
            .from("notifications")
            .select("*")
            .order("created_at", {
                ascending: false
            });

        if (error) {

            console.error(error);

            container.innerHTML =
                '<div class="empty">Unable to load notifications.</div>';

            return;
        }

        if (!data || data.length === 0) {

            container.innerHTML =
                '<div class="empty">No notifications yet.</div>';

            return;
        }

        container.innerHTML = "";

        data.forEach(notification => {

            const item =
                document.createElement("div");

            item.className =
                "notification " +
                (!notification.read ? "unread" : "");

            const status =
                notification.read
                    ? '<span class="status read">READ</span>'
                    : '<span class="status unread">UNREAD</span>';

            const date =
                notification.created_at
                    ? new Date(notification.created_at)
                        .toLocaleString()
                    : "";

            item.innerHTML = `
                <div class="notification-header">
                    <div class="notification-title">
                        ${escapeHtml(notification.title || "Notification")}
                    </div>

                    ${status}
                </div>

                <div class="message">
                    ${escapeHtml(notification.message || "")}
                </div>

                <div class="meta">
                    Type: ${escapeHtml(notification.type || "general")}
                    <br>
                    User ID: ${escapeHtml(notification.user_id || "")}
                    <br>
                    ${escapeHtml(date)}
                </div>

                <div class="actions">

                    ${
                        !notification.read
                        ? `
                            <button
                                class="read-btn"
                                onclick="markAsRead(${notification.id})"
                            >
                                Mark as Read
                            </button>
                        `
                        : ""
                    }

                    <button
                        class="delete-btn"
                        onclick="deleteNotification(${notification.id})"
                    >
                        Delete
                    </button>

                </div>
            `;

            container.appendChild(item);
        });
    }


    async function sendNotification() {

        const userId =
            document.getElementById("userSelect").value;

        const title =
            document.getElementById("title").value.trim();

        const type =
            document.getElementById("type").value;

        const message =
            document.getElementById("message").value.trim();


        if (!userId) {
            showMessage(
                "Please select an investor.",
                "error"
            );
            return;
        }

        if (!title) {
            showMessage(
                "Please enter a notification title.",
                "error"
            );
            return;
        }

        if (!message) {
            showMessage(
                "Please enter a notification message.",
                "error"
            );
            return;
        }


        const {
            error
        } = await supabaseClient
            .from("notifications")
            .insert([
                {
                    user_id: userId,
                    title: title,
                    message: message,
                    type: type,
                    read: false
                }
            ]);


        if (error) {

            console.error(error);

            showMessage(
                "Unable to send notification.",
                "error"
            );

            return;
        }


        showMessage(
            "Notification sent successfully.",
            "success"
        );


        document.getElementById("title").value = "";
        document.getElementById("message").value = "";

        await loadNotifications();
    }


    async function markAsRead(id) {

        const {
            error
        } = await supabaseClient
            .from("notifications")
            .update({
                read: true
            })
            .eq("id", id);


        if (error) {

            console.error(error);

            showMessage(
                "Unable to update notification.",
                "error"
            );

            return;
        }


        showMessage(
            "Notification marked as read.",
            "success"
        );

        await loadNotifications();
    }


    async function deleteNotification(id) {

        const confirmed =
            confirm(
                "Are you sure you want to delete this notification?"
            );

        if (!confirmed) {
            return;
        }


        const {
            error
        } = await supabaseClient
            .from("notifications")
            .delete()
            .eq("id", id);


        if (error) {

            console.error(error);

            showMessage(
                "Unable to delete notification.",
                "error"
            );

            return;
        }


        showMessage(
            "Notification deleted.",
            "success"
        );

        await loadNotifications();
    }


    function escapeHtml(value) {

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    async function initialize() {

        const allowed =
            await checkAdmin();

        if (!allowed) {
            return;
        }

        await loadInvestors();

        await loadNotifications();
    }


    initialize();
</script>

</body>
</html>
